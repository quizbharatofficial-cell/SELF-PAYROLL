name: SELF PAYROLL Android Build

on:
  workflow_dispatch:

  push:
    branches:
      - develop
    paths:
      - "android-app/**"
      - ".github/workflows/android-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build Debug APK
        working-directory: android-app
        run: gradle clean assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -f android-app/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload SELF PAYROLL APK
        uses: actions/upload-artifact@v4
        with:
          name: SELF-PAYROLL-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
