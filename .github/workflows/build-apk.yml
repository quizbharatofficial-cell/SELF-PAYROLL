name: Build SELF PAYROLL APK

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/self-payroll-release.jks"

      - name: Build signed release APK
        working-directory: android-app
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/self-payroll-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle clean assembleRelease

      - name: Upload SELF PAYROLL APK
        uses: actions/upload-artifact@v4
        with:
          name: SELF-PAYROLL-APK
          path: android-app/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
