plugins {
    id 'com.android.application'
}

android {
    namespace 'com.selfpayroll.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.selfpayroll.app"
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName "1.0.3"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_FILE"))
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

dependencies {
}
