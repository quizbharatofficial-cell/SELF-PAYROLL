plugins {
    id 'com.android.application'
}

android {
    namespace 'com.selfpayroll.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.selfpayroll.app"
        minSdk 23
        targetSdk 35
        versionCode 5
        versionName "1.0.4"
    }

    def keystoreFile = System.getenv("KEYSTORE_FILE")
    def keystorePassword = System.getenv("KEYSTORE_PASSWORD")
    def keystoreAlias = System.getenv("KEY_ALIAS")
    def keystoreKeyPassword = System.getenv("KEY_PASSWORD")

    signingConfigs {
        if (keystoreFile) {
            release {
                storeFile file(keystoreFile)
                storePassword keystorePassword
                keyAlias keystoreAlias
                keyPassword keystoreKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (keystoreFile) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }
}

dependencies {
    implementation "androidx.core:core:1.15.0"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
}
