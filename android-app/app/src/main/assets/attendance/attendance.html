<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../js/auth-guard.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Attendance Management - SELF PAYROLL</title>

  <link rel="stylesheet" href="../css/style.css">

<style id="attendanceProfessionalUI">

/* ===== SELF PAYROLL PROFESSIONAL ATTENDANCE UI ===== */

body{
    background:#f4f6f9;
    color:#172033;
    padding-bottom:28px;
}

/* HEADER */
.topbar{
    background:#17243a;
    padding:16px 18px;
    min-height:68px;
    box-shadow:0 2px 8px rgba(0,0,0,.14);
}

.topbar h1{
    margin:0;
    color:#fff;
    font-size:19px;
    font-weight:800;
    letter-spacing:.3px;
}

.topbar p{
    margin:3px 0 0;
    color:#cbd5e1;
    font-size:11px;
}

/* MAIN */
.container{
    width:auto;
    max-width:900px;
    margin:0 auto;
    padding:16px 13px 30px;
}

.page-heading{
    margin-bottom:12px;
}

.page-heading h2{
    margin:0;
    font-size:20px;
    color:#17243a;
    font-weight:800;
}

.page-heading p{
    margin:4px 0 0;
    font-size:11px;
    color:#778195;
}

/* HOME BUTTON */
.actions-bar{
    margin-bottom:12px;
}

.attendance-home-btn{
    display:inline-flex;
    align-items:center;
    width:auto;
    padding:8px 13px;
    border:1px solid #d8dee8;
    background:#fff;
    color:#26364d;
    border-radius:7px;
    box-shadow:0 1px 3px rgba(0,0,0,.05);
}

/* CARDS */
.form-card,
.table-card{
    background:#fff;
    border:1px solid #e4e8ef;
    border-radius:10px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(23,36,58,.06);
}

/* FORM */
.form-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px;
}

.field{
    margin-bottom:11px;
}

.field label{
    display:block;
    margin-bottom:6px;
    color:#37455b;
    font-size:11px;
    font-weight:700;
}

.field input,
.field select,
.field textarea{
    width:100%;
    box-sizing:border-box;
    min-height:42px;
    padding:9px 10px;
    border:1px solid #ccd4df;
    border-radius:6px;
    background:#fff;
    color:#182235;
    font-size:13px;
    outline:none;
}

.field textarea{
    min-height:72px;
    resize:vertical;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
    border-color:#2878d0;
    box-shadow:0 0 0 2px rgba(40,120,208,.12);
}

/* ACTIONS */
.form-actions{
    display:flex;
    gap:9px;
    margin-top:5px;
}

.form-actions .btn{
    min-height:42px;
    border-radius:6px;
    font-size:12px;
    font-weight:800;
}

#saveBtn{
    flex:1;
    background:#2878d0;
    border-color:#2878d0;
    color:#fff;
}

#cancelBtn{
    background:#fff;
    border:1px solid #cfd6df;
    color:#3e4b5e;
}

/* RECORD HEADER */
.table-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:13px;
}

.table-header h3{
    margin:0;
    color:#17243a;
    font-size:16px;
}

#attendanceSearch{
    width:230px;
    max-width:100%;
    min-height:38px;
    padding:8px 10px;
    border:1px solid #ccd4df;
    border-radius:6px;
}

/* TABLE */
.table-responsive{
    overflow-x:auto;
    margin-top:5px;
    border:1px solid #e2e6ec;
    border-radius:7px;
}

table{
    width:100%;
    min-width:820px;
    border-collapse:collapse;
    background:#fff;
}

thead{
    background:#eef3f8;
}

th{
    padding:10px 8px;
    color:#445166;
    font-size:10px;
    text-transform:uppercase;
    white-space:nowrap;
    text-align:left;
    border-bottom:1px solid #dce2e9;
}

td{
    padding:10px 8px;
    color:#263348;
    font-size:11px;
    border-bottom:1px solid #edf0f4;
    white-space:nowrap;
}

tbody tr:last-child td{
    border-bottom:0;
}

/* MESSAGE */
#message{
    margin:10px 0 0;
    font-size:11px;
}

/* MOBILE */
@media(max-width:600px){

    .topbar{
        padding:14px 15px;
    }

    .topbar h1{
        font-size:17px;
    }

    .container{
        padding:13px 10px 25px;
    }

    .page-heading h2{
        font-size:18px;
    }

    .form-card,
    .table-card{
        padding:12px;
        border-radius:8px;
    }

    .form-grid{
        grid-template-columns:1fr 1fr;
        gap:8px;
    }

    .field{
        margin-bottom:8px;
    }

    .field label{
        font-size:10px;
    }

    .field input,
    .field select{
        min-height:40px;
        font-size:12px;
    }

    .form-actions{
        display:grid;
        grid-template-columns:2fr 1fr;
    }

    .table-header{
        display:block;
    }

    .table-header h3{
        margin-bottom:9px;
    }

    #attendanceSearch{
        width:100%;
        box-sizing:border-box;
    }
}

@media(max-width:380px){

    .form-grid{
        grid-template-columns:1fr;
    }

}

</style>

</head>

<body>

<header class="topbar">
  <div>
    <h1>SELF PAYROLL</h1>
    <p>Attendance Management</p>
  </div>
</header>

<main class="container">

  <div class="page-heading">
    <h2>Attendance Management</h2>
    <p>Manage daily employee attendance</p>
  </div>

  <div class="actions-bar">
    <a href="../self-attendance-home.html" class="btn btn-secondary attendance-home-btn">
      ← Home
    </a>
  </div>


  <section class="form-card">

    <form id="attendanceForm">

      <input type="hidden" id="recordId">

      <div class="form-grid">

        <div class="field">
          <label>Attendance Date *</label>
          <input
            type="date"
            id="attendanceDate"
            required
          >
        </div>


        <div class="field">
          <label>Employee *</label>
          <select id="employee" required>
            <option value="">Select Employee</option>
          </select>
        </div>


        <div class="field">
          <label>Attendance Status *</label>

          <select id="attendanceStatus" required>
            <option value="P">Present (P)</option>
            <option value="A">Absent (A)</option>
            <option value="HD">Half Day (HD)</option>
            <option value="PL">Paid Leave (PL)</option>
            <option value="UL">Unpaid Leave (UL)</option>
            <option value="WO">Weekly Off (WO)</option>
            <option value="H">Holiday (H)</option>
          </select>
        </div>


        <div class="field">
          <label>Shift</label>

          <select id="shift">
            <option value="">Select Shift</option>
          </select>
        </div>


        <div class="field">
          <label>In Time</label>
          <input
            type="time"
            id="inTime"
          >
        </div>


        <div class="field">
          <label>Out Time</label>
          <input
            type="time"
            id="outTime"
          >
        </div>


        <div class="field">
          <label>OT Hours (Manual)</label>

          <input
            type="number"
            id="otHours"
            min="0"
            step="0.01"
            value="0"
            placeholder="Enter OT hours"
          >
        </div>


        <div class="field">
          <label>Late Minutes</label>

          <input
            type="number"
            id="lateMinutes"
            min="0"
            step="1"
            value="0"
          >
        </div>


        <div class="field">
          <label>Early Out Minutes</label>

          <input
            type="number"
            id="earlyOutMinutes"
            min="0"
            step="1"
            value="0"
          >
        </div>

      </div>


      <div class="field">
        <label>Remarks</label>

        <textarea
          id="remarks"
          rows="3"
          placeholder="Optional attendance remarks"
        ></textarea>
      </div>


      <div class="form-actions">

        <button
          type="submit"
          class="btn btn-primary"
          id="saveBtn"
        >
          Save Attendance
        </button>

        <button
          type="button"
          class="btn btn-secondary"
          id="cancelBtn"
        >
          Clear
        </button>

      </div>

      <p id="message"></p>

    </form>

  </section>


  <section class="table-card">

    <div class="table-header">

      <h3>Attendance Records</h3>

      <input
        type="search"
        id="attendanceSearch"
        placeholder="Search employee/date/status..."
      >

    </div>


    <div class="form-grid">

      <div class="field">
        <label>Filter From</label>
        <input type="date" id="filterFrom">
      </div>

      <div class="field">
        <label>Filter To</label>
        <input type="date" id="filterTo">
      </div>

      <div class="field">
        <label>Status Filter</label>

        <select id="statusFilter">
          <option value="">All Status</option>
          <option value="P">Present</option>
          <option value="A">Absent</option>
          <option value="HD">Half Day</option>
          <option value="PL">Paid Leave</option>
          <option value="UL">Unpaid Leave</option>
          <option value="WO">Weekly Off</option>
          <option value="H">Holiday</option>
        </select>
      </div>

    </div>


    <div class="table-responsive">

      <table>

        <thead>
          <tr>
            <th>Date</th>
            <th>Employee</th>
            <th>Status</th>
            <th>Shift</th>
            <th>In</th>
            <th>Out</th>
            <th>OT</th>
            <th>Late</th>
            <th>Early Out</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody id="attendanceTable"></tbody>

      </table>

    </div>

  </section>

</main>


<div id="toast" class="toast"></div>

<script src="../js/modules/attendance.js"></script>

<script src="../js/core/code-generator.js"></script>
</body>
</html>
